<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentoVault - Interactive System Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .demo-container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .demo-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .demo-header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .demo-header .step-indicator {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
        }

        .demo-content {
            display: flex;
            min-height: 700px;
            position: relative;
        }

        .app-screen {
            flex: 1;
            padding: 40px;
            background: #f8f9fa;
            position: relative;
            overflow-y: auto;
        }

        .callout-panel {
            width: 400px;
            background: #2c3e50;
            color: white;
            padding: 30px;
            overflow-y: auto;
            border-left: 3px solid #667eea;
        }

        .callout-panel h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .callout-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .callout-section:last-child {
            border-bottom: none;
        }

        .callout-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #3498db;
            display: flex;
            align-items: center;
        }

        .callout-section h3::before {
            content: "▸";
            margin-right: 8px;
            color: #667eea;
        }

        .callout-section p {
            font-size: 14px;
            line-height: 1.6;
            color: #ecf0f1;
            margin-bottom: 8px;
        }

        .callout-section ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        .callout-section li {
            font-size: 13px;
            line-height: 1.6;
            color: #bdc3c7;
            margin-bottom: 6px;
        }

        .highlight {
            color: #f39c12;
            font-weight: 600;
        }

        .warning {
            color: #e74c3c;
            font-weight: 600;
        }

        .success {
            color: #2ecc71;
            font-weight: 600;
        }

        /* App Screen Styles */
        .screen-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        .screen-card h2 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .screen-card p {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            padding: 14px 32px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .info-box {
            background: #e8f4fd;
            border-left: 4px solid #3498db;
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .info-box p {
            font-size: 14px;
            color: #2c3e50;
            margin: 0;
        }

        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #f39c12;
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .warning-box p {
            font-size: 14px;
            color: #856404;
            margin: 0;
        }

        .quote-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }

        .quote-display .amount {
            font-size: 48px;
            font-weight: 700;
            margin: 20px 0;
        }

        .quote-display .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        .quote-display .detail-item {
            text-align: center;
        }

        .quote-display .detail-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .quote-display .detail-value {
            font-size: 18px;
            font-weight: 600;
        }

        .consent-bridge {
            background: #fff3cd;
            border: 3px solid #f39c12;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .consent-bridge h3 {
            color: #856404;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .consent-bridge h3::before {
            content: "⚠️";
            margin-right: 10px;
            font-size: 24px;
        }

        .timer-display {
            background: #2c3e50;
            color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }

        .timer-display .countdown {
            font-size: 72px;
            font-weight: 700;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        .status-tracker {
            display: flex;
            justify-content: space-between;
            margin: 30px 0;
            position: relative;
        }

        .status-tracker::before {
            content: "";
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 4px;
            background: #e1e8ed;
            z-index: 0;
        }

        .status-step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .status-step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e1e8ed;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
        }

        .status-step.active .status-step-circle {
            background: #667eea;
        }

        .status-step.completed .status-step-circle {
            background: #2ecc71;
        }

        .status-step-label {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
        }

        .navigation-controls {
            padding: 20px 40px;
            background: #f8f9fa;
            border-top: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 24px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn-prev {
            background: #e1e8ed;
            color: #2c3e50;
        }

        .nav-btn-prev:hover {
            background: #d1d8dd;
        }

        .nav-btn-next {
            background: #667eea;
            color: white;
        }

        .nav-btn-next:hover {
            background: #5568d3;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cost-breakdown {
            background: #f8f9fa;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .cost-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e1e8ed;
        }

        .cost-item:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 18px;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #2c3e50;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

            <button class="nav-btn nav-btn-next" id="nextBtn" onclick="nextStep()">Next →</button>
        </div>
    </div>

        function renderStep(stepIndex) {
            const step = steps[stepIndex];

            // Update header
            document.getElementById('stepIndicator').textContent = `Step ${stepIndex + 1} of ${steps.length}`;

            // Render app screen
            document.getElementById('appScreen').innerHTML = step.screen;

            // Render callouts
            let calloutsHTML = `<h2>${step.callouts.title}</h2>`;
            step.callouts.sections.forEach(section => {
                calloutsHTML += `
                    <div class="callout-section">
                        <h3>${section.heading}</h3>
                        <p>${section.content}</p>
                        ${section.bullets.length > 0 ? `
                            <ul>
                                ${section.bullets.map(bullet => `<li>${bullet}</li>`).join('')}
                            </ul>
                        ` : ''}
                    </div>
                `;
            });
            document.getElementById('calloutPanel').innerHTML = calloutsHTML;

            // Update navigation buttons
            document.getElementById('prevBtn').disabled = (stepIndex === 0);
            document.getElementById('nextBtn').disabled = (stepIndex === steps.length - 1);

            // Scroll to top
            document.getElementById('appScreen').scrollTop = 0;
            document.getElementById('calloutPanel').scrollTop = 0;
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        }

        function previousStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextStep();
            if (e.key === 'ArrowLeft') previousStep();
        });

        // Initial render
        renderStep(0);
